<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETP Ibagué · Seguimiento de alertas UMUS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.js"></script>
<style>
  @font-face{ font-family:'Montserrat'; src:url(fonts/montserrat.woff2) format('woff2'); font-weight:500 900; font-display:swap }
  @font-face{ font-family:'Source Sans 3'; src:url(fonts/sourcesans3.woff2) format('woff2'); font-weight:400 700; font-display:swap }

  /* ===== Lienzo 1920×1080 = 120×67,5 rem. Regla de lectura a distancia: nada de texto por debajo de 1,5 rem (24 px). ===== */
  :root{
    --paper:#E7ECF5; --card:#F4F7FC; --ink:#0F1F52; --tx:#26325C; --mut:#5B6688; --rule:#CBD6E7; --navy:#0B1F5E; --navy2:#16307F;
    --rojo:#D3313A; --ambar:#F0A800; --verde:#1E9E4F; --azul:#2B63D9; --sol:#FDB913;
    --fd:'Montserrat',system-ui,'Segoe UI',sans-serif; --ft:'Source Sans 3',system-ui,'Segoe UI',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html{ font-size:min(.8333vw,1.4815vh) }
  body{ height:100vh; background:#0d0d10; overflow:hidden; font:500 1.75rem/1.32 var(--ft); color:var(--tx) }
  button{ font:inherit; color:inherit; cursor:pointer; background:none; border:0 }
  svg text{ font-family:var(--ft) }
  mark{ background:linear-gradient(transparent 60%, var(--sol) 60% 93%, transparent 93%); color:inherit; padding:0 .12em }

  #stage{ position:absolute; left:50%; top:50%; width:120rem; height:67.5rem; transform:translate(-50%,-50%); overflow:hidden; background:var(--paper) }
  #stage.oscuro{ background:var(--navy) }
  #banda{ position:absolute; left:0; right:0; bottom:0; height:.55rem; display:flex; z-index:30 }
  #banda i{ flex:1 } #banda i:nth-child(1){ background:#0B1F5E } #banda i:nth-child(2){ background:#E5484D }
  #banda i:nth-child(3){ background:#1FBF5B } #banda i:nth-child(4){ background:#FDB913 }

  /* ---------- barra superior ---------- */
  #top{ position:absolute; left:var(--sp,0rem); right:0; top:0; height:6.4rem; display:flex; align-items:center; gap:2rem; padding:0 3.2rem; z-index:10; transition:left .45s ease }
  #top .t1{ font:800 1.75rem var(--fd); color:var(--ink); letter-spacing:-.01em }
  #top .t2{ font-size:1.5rem; color:var(--mut); margin-top:.1rem }
  #top .t2 b{ color:var(--ink); font-weight:700 }
  #top .lg{ height:4.9rem; width:auto; display:block }
  #top .sep{ width:.2rem; height:3.6rem; background:var(--rule) }
  #top .der{ margin-left:auto; display:flex; align-items:center; gap:1.6rem }
  #top .fs{ width:3.6rem; height:3.6rem; color:var(--mut); border-radius:.6rem } #top .fs:hover{ background:rgba(15,31,82,.08); color:var(--ink) }
  #stage.oscuro #top{ display:none }

  /* ---------- escenas ---------- */
  #escena{ position:absolute; left:0; right:0; top:0; bottom:6.6rem }
  #stage.oscuro #escena{ bottom:0 }
  .scene{ position:absolute; inset:0; animation:entra .5s cubic-bezier(.22,.8,.3,1) }
  .scene.atras{ animation-name:entraAtras }
  @keyframes entra{ from{ opacity:0; transform:translateX(2rem) } }
  @keyframes entraAtras{ from{ opacity:0; transform:translateX(-2rem) } }
  .rv{ opacity:0; transform:translateY(.8rem); animation:rv .55s cubic-bezier(.22,.8,.3,1) forwards; animation-delay:calc(var(--i,0)*80ms + 120ms) }
  @keyframes rv{ to{ opacity:1; transform:none } }

  /* --- resumen de alerta --- */
  .spine{ position:absolute; left:0; top:0; bottom:0; width:20rem; background:var(--cat); color:var(--catx); padding:8.4rem 2.4rem 2rem 2.8rem }
  .spine .lab{ font:700 1.75rem var(--fd); opacity:.9 }
  .spine .num{ font:800 17rem/.86 var(--fd); letter-spacing:-.05em; margin:.6rem 0 2.6rem -.5rem }
  .spine dl{ font-size:1.5rem; line-height:1.15 }
  .spine dt{ opacity:.8; margin-top:1.3rem } .spine dd{ font:700 1.9rem var(--fd); margin-top:.1rem }
  .rmain{ position:absolute; left:24rem; right:4rem; top:8rem; bottom:15.4rem }
  .rmain h1{ font:800 4.3rem/1.02 var(--fd); color:var(--ink); letter-spacing:-.025em }
  .ofi{ font-size:1.5rem; color:var(--mut); margin:.7rem 0 2.4rem }
  .rcols{ display:grid; grid-template-columns:minmax(0,1fr) 33rem; gap:4.4rem }
  .frase{ font:600 2.75rem/1.18 var(--ft); color:var(--ink) }
  .hechos{ list-style:none; margin-top:2rem; display:flex; flex-direction:column; gap:1rem }
  .hechos li{ font-size:2.1rem; line-height:1.25; padding-left:2.4rem; position:relative }
  .hechos li:before{ content:""; position:absolute; left:0; top:.5em; width:1rem; height:1rem; border-radius:.25rem; background:var(--cat) }
  .cifras{ border-left:.3rem solid var(--rule); padding-left:3rem; display:flex; flex-direction:column; gap:2.4rem; justify-content:flex-start }
  .cifra b{ display:block; font:800 7rem/1 var(--fd); color:var(--ink); letter-spacing:-.035em; white-space:nowrap }
  .cifra span{ display:block; font-size:1.7rem; line-height:1.2; color:var(--mut); margin-top:.5rem }
  .postura{ position:absolute; left:20rem; right:0; bottom:0; height:13.4rem; background:var(--navy); color:#fff; padding:2.1rem 4rem 0 4rem }
  .postura span{ font:700 1.5rem var(--fd); color:var(--sol); letter-spacing:.02em }
  .postura p{ font:600 2.45rem/1.2 var(--ft); margin-top:.5rem; max-width:92rem }

  /* --- explorar --- */
  .exp .spine{ width:7rem; padding:7.6rem 0 0; text-align:center }
  .exp .spine .num{ font-size:4.6rem; margin:0; letter-spacing:-.03em }
  .emain{ position:absolute; left:11rem; right:3.2rem; top:7.4rem; bottom:.4rem }
  .ehead{ display:flex; align-items:baseline; gap:3rem; height:5rem }
  .ehead h2{ font:800 3rem/1 var(--fd); color:var(--ink); letter-spacing:-.02em; white-space:nowrap }
  .prompt{ display:flex; align-items:center; gap:1rem; font-size:1.65rem; line-height:1.2; color:var(--mut); margin-left:auto; max-width:60rem; text-align:right }
  .prompt svg{ flex:none; width:3rem; height:3rem; color:var(--cat) }
  .viz{ position:absolute; left:0; right:0; top:5.6rem; bottom:0; min-height:0; overflow:hidden }
  [data-count]{ font-variant-numeric:tabular-nums }

  /* ---------- controles ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; gap:.8rem; padding:1rem 2rem; border-radius:.7rem; font:700 1.6rem var(--fd); background:var(--navy); color:#fff; transition:transform .15s, background .2s }
  .btn:hover{ transform:translateY(-.15rem); background:var(--navy2) } .btn:active{ transform:none }
  .btn.sol{ background:var(--sol); color:var(--ink) } .btn.sol:hover{ background:#ffc93d }
  .btn.borde{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 .22rem var(--ink) } .btn.borde:hover{ background:rgba(15,31,82,.07) }
  .btn:disabled{ opacity:.35; cursor:default; transform:none }
  .chip{ display:inline-flex; align-items:center; gap:.7rem; padding:.6rem 1.4rem; border-radius:.6rem; font:700 1.5rem var(--fd); color:var(--ink); box-shadow:inset 0 0 0 .2rem var(--ink); transition:.15s }
  .chip:hover{ background:rgba(15,31,82,.08) }
  .chip.on{ background:var(--ink); color:#fff }
  .chip i{ width:1rem; height:1rem; border-radius:50%; background:var(--c) }
  .seg{ display:inline-flex; border-radius:.7rem; box-shadow:inset 0 0 0 .2rem var(--ink); overflow:hidden }
  .seg button{ padding:.7rem 1.5rem; white-space:nowrap; font:700 1.5rem var(--fd); color:var(--ink) } .seg button.on{ background:var(--ink); color:#fff }
  .sw{ display:inline-flex; align-items:center; gap:1.2rem; font:600 1.65rem var(--ft); color:var(--ink); cursor:pointer; user-select:none }
  .sw i{ position:relative; width:5.4rem; height:2.9rem; border-radius:3rem; background:#B7C3D6; transition:.25s; flex:none }
  .sw i:after{ content:""; position:absolute; left:.35rem; top:.35rem; width:2.2rem; height:2.2rem; border-radius:50%; background:#fff; transition:.25s cubic-bezier(.3,1.5,.5,1) }
  .sw.on i{ background:var(--verde) } .sw.on i:after{ transform:translateX(2.5rem) }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3.4rem; background:transparent; cursor:pointer }
  input[type=range]::-webkit-slider-runnable-track{ height:.9rem; border-radius:1rem; background:#C7D2E3 }
  input[type=range]::-moz-range-track{ height:.9rem; border-radius:1rem; background:#C7D2E3 }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:3.2rem; height:3.2rem; margin-top:-1.15rem; border-radius:50%; background:var(--navy); border:.55rem solid var(--sol) }
  input[type=range]::-moz-range-thumb{ width:2.2rem; height:2.2rem; border-radius:50%; background:var(--navy); border:.55rem solid var(--sol) }
  .tip{ position:absolute; z-index:60; pointer-events:none; background:var(--ink); color:#fff; padding:.7rem 1.1rem; border-radius:.5rem; font-size:1.5rem; line-height:1.2; max-width:34rem; opacity:0; transition:opacity .12s }
  .tip.ver{ opacity:1 }
  .mut{ color:var(--mut) }

  /* ---------- navegación: una línea de bus con paradas ---------- */
  #nav{ position:absolute; left:3rem; right:3rem; bottom:1.1rem; height:5.2rem; display:flex; align-items:center; gap:1.8rem; z-index:20 }
  #stage.oscuro #nav{ display:none }
  #nav .nb{ flex:none; width:4.2rem; height:4.2rem; border-radius:50%; color:var(--ink); box-shadow:inset 0 0 0 .22rem var(--ink); display:flex; align-items:center; justify-content:center }
  #nav .nb:hover:not(:disabled){ background:var(--ink); color:#fff } #nav .nb:disabled{ opacity:.25; cursor:default }
  #nav .nb svg{ width:2rem; height:2rem }
  #navtxt{ flex:none; width:24rem; font:700 1.5rem/1.15 var(--fd); color:var(--ink) }
  #navtxt small{ display:block; font:500 1.5rem var(--ft); color:var(--mut); margin-top:.2rem }
  #nav .ln{ position:relative; flex:1; height:100% }
  #nav .ln:before{ content:""; position:absolute; left:0; right:0; top:calc(50% + 1rem); height:.32rem; background:var(--ink); border-radius:1rem }
  #nav .ln:after{ content:""; position:absolute; left:0; top:calc(50% + 1rem); height:.32rem; width:var(--p,0%); background:var(--sol); border-radius:1rem; transition:width .8s cubic-bezier(.5,0,.2,1) }
  #nav .sts{ position:absolute; left:0; right:0; top:calc(50% + 1rem); display:flex; justify-content:space-between }
  #nav .st{ position:relative; z-index:1; width:3.6rem; height:3.6rem; margin-top:-1.7rem; border-radius:50%; background:var(--paper); box-shadow:inset 0 0 0 .3rem var(--c,#0F1F52); font:800 1.6rem var(--fd); color:var(--ink); display:flex; align-items:center; justify-content:center; transition:transform .25s cubic-bezier(.3,1.5,.5,1), background .25s }
  #nav .st:hover{ transform:scale(1.15) }
  #nav .st.act{ background:var(--c); color:var(--cx,#fff); transform:scale(1.28) }
  #nav .st svg{ width:1.9rem; height:1.9rem }
  #nav .bus{ position:absolute; top:-.4rem; width:5.6rem; height:3rem; margin-left:-2.8rem; color:var(--verde); transition:left .8s cubic-bezier(.5,0,.2,1); pointer-events:none }

  .maplibregl-ctrl-attrib{ font-size:.9rem }
</style>
</head>

<script>
/* =====================================================================
   NÚCLEO: utilidades + motor de escenas
   ===================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const fm  = n => Math.round(n).toLocaleString('es-CO');
const fM  = n => '$' + Math.round(n/1e6).toLocaleString('es-CO') + ' M';
const fB  = (n,d=1) => '$' + (n/1e9).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' mil M';
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fFecha = d => d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear();
const md = s => s.replace(/\*(.+?)\*/g,'<mark>$1</mark>');
const ico = (id,cls='') => `<svg class="${cls}" viewBox="0 0 40 40"><use href="#${id}"/></svg>`;
const VIS = {}, NODO = {};
const limpiar = [];
const salvo = f => { try{ f() }catch(e){ console.error(e) } };

/* cuenta animada: <b data-count="75.01" data-dec="2" data-suf=" %"> */
function contar(root){
  $$('[data-count]',root).forEach(n=>{
    const to=+n.dataset.count, dec=+(n.dataset.dec||0), pre=n.dataset.pre||'', suf=n.dataset.suf||'', dur=+(n.dataset.dur||1200), t0=performance.now();
    (function f(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      n.textContent=pre+(to*e).toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
      if(p<1) requestAnimationFrame(f); })(t0);
  });
}

/* arrastre (mouse y dedo) */
function arrastrar(nodo,{inicio,mueve,fin}){
  nodo.style.touchAction='none';
  nodo.addEventListener('pointerdown',e=>{
    e.preventDefault(); nodo.setPointerCapture(e.pointerId); inicio&&inicio(e);
    const mv=ev=>mueve&&mueve(ev), up=ev=>{ nodo.removeEventListener('pointermove',mv); nodo.removeEventListener('pointerup',up); nodo.removeEventListener('pointercancel',up); fin&&fin(ev); };
    nodo.addEventListener('pointermove',mv); nodo.addEventListener('pointerup',up); nodo.addEventListener('pointercancel',up);
  });
}
const svgPt = (svg,e) => { const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };

const tip=$('#tip');
function verTip(html,e){ tip.innerHTML=html; tip.classList.add('ver'); const r=$('#stage').getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-r.left+16, r.width-tip.offsetWidth-8)+'px';
  tip.style.top=(e.clientY-r.top-tip.offsetHeight-16<0 ? e.clientY-r.top+22 : e.clientY-r.top-tip.offsetHeight-16)+'px'; }
function ocultaTip(){ tip.classList.remove('ver'); }
limpiar.push(ocultaTip);

/* ---------- guion de escenas ---------- */
const ESC = [{tipo:'portada'},{tipo:'panorama'}];
ALERTAS.forEach(a=>{ ESC.push({tipo:'resumen',a}); a.vistas.forEach((v,i)=>ESC.push({tipo:'explorar',a,v,i,de:a.vistas.length})); });
ESC.push({tipo:'ruta'},{tipo:'fin'});
const idxAlerta = n => ESC.findIndex(s=>s.a && s.a.n===n);
const idxTipo   = t => ESC.findIndex(s=>s.tipo===t);
const RAIL = [{i:idxTipo('panorama'), c:'#0F1F52', cx:'#fff', ic:'i-home', lbl:'Panorama'},
  ...ALERTAS.map(a=>({i:idxAlerta(a.n), c:CAT[a.cat].c, cx:CAT[a.cat].tx, t:a.n, lbl:a.corto})),
  {i:idxTipo('ruta'), c:'#FDB913', cx:'#0F1F52', ic:'i-flag', lbl:'Hoja de ruta'}];
const etiqueta = s => s.tipo==='resumen' ? ['Alerta '+s.a.n,'Resumen'] : s.tipo==='explorar' ? ['Alerta '+s.a.n,'Explorar'+(s.de>1?' '+(s.i+1)+' de '+s.de:'')]
  : s.tipo==='panorama' ? ['Panorama','Las 9 alertas'] : s.tipo==='ruta' ? ['Hoja de ruta','Quién, qué y cuándo'] : ['',''];

let idx = -1;
function ir(n){
  n=Math.max(0,Math.min(ESC.length-1,n)); if(n===idx) return;
  const atras=n<idx; limpiar.splice(0).forEach(salvo); idx=n; const s=ESC[n];
  const nodo = (NODO[s.tipo] || (()=>{ const e=document.createElement('section'); e.className='scene'; return e; }))(s);
  if(atras) nodo.classList.add('atras');
  const cont=$('#escena'); cont.innerHTML=''; cont.append(nodo);
  $$('.rv',nodo).forEach((e,i)=>e.style.setProperty('--i',i));
  const fn = s.tipo==='explorar' ? VIS[s.v.vis] : VIS[s.tipo];
  if(fn) salvo(()=>fn(s.tipo==='explorar'?$('.viz',nodo):nodo, s));
  /* el conteo de cifras arranca solo cuando la entrada (fade+desplazamiento) ya terminó,
     para que no se vean dos animaciones distintas peleando al mismo tiempo */
  const nRv = $$('.rv',nodo).length;
  const tCont = setTimeout(()=>contar(nodo), Math.min(900, 120 + nRv*80 + 550));
  limpiar.push(()=>clearTimeout(tCont));
  const st=$('#stage'); st.classList.toggle('oscuro', s.tipo==='portada'||s.tipo==='fin');
  st.style.setProperty('--sp', s.tipo==='resumen'?'20rem':s.tipo==='explorar'?'7rem':'0rem');
  actualizaNav();
  history.replaceState(null,'','#'+n);
}
function actualizaNav(){
  const s=ESC[idx]; let act=-1;
  RAIL.forEach((r,k)=>{ const e=$('#st'+k); const es = s.a ? r.t===s.a.n : (s.tipo==='panorama'&&k===0)||(s.tipo==='ruta'&&k===RAIL.length-1); if(es) act=k; e.classList.toggle('act',es); });
  const [a,b]=etiqueta(s); $('#navtxt').innerHTML = a ? `${a}<small>${b}</small>` : '';
  $('#prev').disabled = idx<=0; $('#next').disabled = idx>=ESC.length-1;
  if(act<0) return;
  $('#ln').style.setProperty('--p',(act/(RAIL.length-1)*100)+'%');
  requestAnimationFrame(()=>{ const st=$('#st'+act), ln=$('#ln'); if(!st||!ln.clientWidth) return;
    const a=st.getBoundingClientRect(), w=ln.getBoundingClientRect(), R=parseFloat(getComputedStyle(document.documentElement).fontSize);
    $('#railBus').style.left=((a.left+a.width/2-w.left)/R)+'rem'; });
}
$('#sts').innerHTML = RAIL.map((r,k)=>`<button class="st" id="st${k}" style="--c:${r.c};--cx:${r.cx}" title="${r.lbl}">${r.ic?`<svg viewBox="0 0 40 40"><use href="#${r.ic}"/></svg>`:r.t}</button>`).join('');
RAIL.forEach((r,k)=>$('#st'+k).onclick=()=>ir(r.i));
$('#prev').onclick=()=>ir(idx-1); $('#next').onclick=()=>ir(idx+1);
$('#corteTxt').textContent=CORTE.txt;
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
window.addEventListener('resize',()=>{ if(idx>=0) actualizaNav(); });
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !['ArrowLeft','ArrowRight'].includes(e.key)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown') ir(idx+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp') ir(idx-1);
  else if(e.key==='Home') ir(0); else if(e.key==='End') ir(ESC.length-1);
  else if(/^[1-9]$/.test(e.key)) ir(idxAlerta(+e.key));
  else if(e.key==='p'||e.key==='P') ir(idxTipo('panorama'));
  else if(e.key==='r'||e.key==='R') ir(idxTipo('ruta'));
  else if(e.key==='f'||e.key==='F') $('#fs').click();
});
</script>
<script src="escenas.js"></script>
<script src="visuales.js"></script>
<script>
  const h0 = parseInt(location.hash.slice(1),10);
  ir(Number.isFinite(h0) ? h0 : 0);
</script>
</body>
