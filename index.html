<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETP Ibagué · Seguimiento de alertas UMUS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.min.js"></script>
<style>
  /* ============ sistema de diseño — todo en rem sobre un lienzo 1920×1080 (120×67,5 rem) ============ */
  :root{
    --navy:#0A1F5C; --deep:#001233; --royal:#1D4ED8; --gold:#F0A800;
    --rojo:#E5484D; --ambar:#F0A800; --verde:#1FBF5B; --azul:#4C8DFF; --gris:#7C8DB5;
    --ink:#EAF0FF; --mut:#A9B8E0; --line:rgba(255,255,255,.15); --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{font-size:min(.8333vw,1.4815vh)}
  body{height:100vh; background:#000814; color:var(--ink); overflow:hidden;
    font:400 1rem/1.45 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
  button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
  svg text{font-family:inherit}

  #stage{position:absolute; left:50%; top:50%; width:120rem; height:67.5rem; transform:translate(-50%,-50%); overflow:hidden;
    background:
      radial-gradient(70rem 45rem at 88% -5%, rgba(29,78,216,.42), transparent 62%),
      radial-gradient(55rem 40rem at -5% 105%, rgba(240,168,0,.13), transparent 60%),
      linear-gradient(140deg,#0A1F5C 0%,#04174A 45%,#001233 100%)}
  #stage:before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.06;
    background:repeating-linear-gradient(172deg, transparent 0 3.4rem, #fff 3.4rem calc(3.4rem + 1px))}   /* pentagrama sutil */
  #banda{position:absolute; left:0; right:0; bottom:0; height:.4rem; display:flex; z-index:20}
  #banda i{flex:1} #banda i:nth-child(1){background:#0A1F5C} #banda i:nth-child(2){background:#E5484D}
  #banda i:nth-child(3){background:#1FBF5B} #banda i:nth-child(4){background:#F0A800}

  /* ---------- encabezado ---------- */
  header{position:absolute; left:0; right:0; top:0; height:5rem; display:flex; align-items:center; gap:1.2rem; padding:0 2.5rem; z-index:15}
  header .ico{height:3.2rem; width:auto}
  header .brand small{display:block; font-size:.74rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:700}
  header .brand b{font-size:1.3rem; font-weight:800; letter-spacing:-.01em}
  header .corte{margin-left:auto; font-size:.88rem; color:var(--mut); border:1px solid var(--line); padding:.35rem .95rem; border-radius:99rem}
  header .corte b{color:#fff}
  header .pill{height:3.4rem; background:#fff; border-radius:.8rem; padding:.2rem .5rem; display:block}
  header .fs{width:2.6rem; height:2.6rem; border-radius:50%; border:1px solid var(--line); font-size:1.1rem; color:var(--mut)}
  header .fs:hover{background:var(--glass2); color:#fff}

  /* ---------- escena ---------- */
  #escena{position:absolute; inset:5rem 0 6.6rem 0}
  .scene{position:absolute; inset:0; padding:.4rem 2.5rem 0; display:grid; grid-template-columns:38rem minmax(0,1fr); gap:2rem;
    animation:entra .6s cubic-bezier(.2,.8,.2,1)}
  .scene.atras{animation-name:entraAtras}
  @keyframes entra{from{opacity:0; transform:translateX(2.4rem)}}
  @keyframes entraAtras{from{opacity:0; transform:translateX(-2.4rem)}}
  .rv{opacity:0; transform:translateY(.9rem); animation:rv .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i,0)*70ms + 120ms)}
  @keyframes rv{to{opacity:1; transform:none}}

  .izq{min-height:0; overflow:auto; padding-right:.6rem; scrollbar-width:thin; scrollbar-color:var(--line) transparent}
  .tags{display:flex; flex-wrap:wrap; gap:.5rem}
  .tag{font-size:.78rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; padding:.3rem .8rem; border-radius:99rem;
    background:var(--glass2); border:1px solid var(--line); color:var(--mut)}
  .tag.num{background:var(--cat); color:#fff; border-color:transparent}
  .tag.cat{color:var(--cat); border-color:var(--cat); display:inline-flex; align-items:center; gap:.4rem}
  .tag.cat i{width:.6rem; height:.6rem; border-radius:50%; background:var(--cat); box-shadow:0 0 .8rem var(--cat)}
  .izq h1{font-size:2.1rem; line-height:1.1; font-weight:900; letter-spacing:-.02em; margin:.9rem 0 .8rem}
  .msg{font-size:1.24rem; line-height:1.38; font-weight:600; padding:.15rem 0 .15rem 1.05rem; border-left:.32rem solid var(--cat); color:#fff}
  .izq h3{font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:1.1rem 0 .5rem}
  .sit{list-style:none; display:flex; flex-direction:column; gap:.5rem}
  .sit li{position:relative; padding-left:1.2rem; font-size:1rem; line-height:1.38; color:#D5E0FA}
  .sit li:before{content:""; position:absolute; left:.05rem; top:.5em; width:.46rem; height:.46rem; border-radius:2px; background:var(--cat); transform:rotate(45deg)}
  .postura{margin-top:1.05rem; padding:.95rem 1.15rem .95rem 1.35rem; border-radius:1rem; position:relative; overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.04)); border:1px solid var(--line)}
  .postura:before{content:""; position:absolute; left:0; top:0; bottom:0; width:.3rem; background:var(--gold)}
  .postura b{display:block; font-size:.76rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:.3rem}
  .postura p{font-size:1rem; line-height:1.42; color:#fff}

  .card{position:relative; background:var(--glass); border:1px solid var(--line); border-radius:1.3rem; overflow:hidden;
    box-shadow:0 1.5rem 4rem rgba(0,8,30,.35); backdrop-filter:blur(6px)}
  .vis{min-height:0; padding:1.3rem 1.5rem; display:flex; flex-direction:column; gap:1rem}

  /* ---------- controles ---------- */
  .chip{display:inline-flex; align-items:center; gap:.45rem; padding:.42rem .95rem; border-radius:99rem; border:1px solid var(--line);
    background:var(--glass); font-size:.88rem; font-weight:700; color:var(--ink); transition:.2s; user-select:none}
  .chip:hover{background:var(--glass2); transform:translateY(-1px)}
  .chip.on{background:#fff; color:var(--navy); border-color:#fff}
  .chip i{width:.65rem; height:.65rem; border-radius:50%; display:inline-block}
  .btn{display:inline-flex; align-items:center; gap:.5rem; padding:.6rem 1.3rem; border-radius:.8rem; font-weight:800; font-size:.95rem;
    background:var(--gold); color:#1B1200; box-shadow:0 .5rem 1.4rem rgba(240,168,0,.28); transition:.2s}
  .btn:hover{transform:translateY(-2px); box-shadow:0 .8rem 1.8rem rgba(240,168,0,.4)}
  .btn.sec{background:var(--glass2); color:#fff; box-shadow:none; border:1px solid var(--line)}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:.8rem; overflow:hidden}
  .seg button{padding:.42rem 1rem; font-size:.88rem; font-weight:700; color:var(--mut)}
  .seg button.on{background:#fff; color:var(--navy)}
  .sw{display:inline-flex; align-items:center; gap:.6rem; font-size:.9rem; font-weight:700; cursor:pointer; user-select:none}
  .sw i{position:relative; width:2.6rem; height:1.4rem; border-radius:99rem; background:rgba(255,255,255,.2); transition:.25s}
  .sw i:after{content:""; position:absolute; left:.17rem; top:.17rem; width:1.06rem; height:1.06rem; border-radius:50%; background:#fff; transition:.25s}
  .sw.on i{background:var(--verde)} .sw.on i:after{transform:translateX(1.2rem)}
  input[type=range]{width:100%; accent-color:var(--gold); height:1.4rem; cursor:pointer}
  .mut{color:var(--mut)}
  .kpi b{display:block; font-size:2.3rem; font-weight:900; line-height:1; letter-spacing:-.02em}
  .kpi small{display:block; margin-top:.3rem; font-size:.74rem; letter-spacing:.13em; text-transform:uppercase; color:var(--mut); font-weight:700}
  .tip{position:absolute; z-index:40; pointer-events:none; background:#fff; color:#0B1A44; padding:.5rem .8rem; border-radius:.6rem; font-size:.85rem; font-weight:600;
    box-shadow:0 .6rem 1.6rem rgba(0,0,0,.4); max-width:22rem; opacity:0; transition:opacity .15s}
  .tip.ver{opacity:1}

  /* ---------- riel de estaciones (navegación) ---------- */
  #rail{position:absolute; left:2.5rem; right:2.5rem; bottom:.8rem; height:5.4rem; z-index:15; display:flex; align-items:flex-end; gap:1.2rem}
  #rail .nv{flex:none; width:2.7rem; height:2.7rem; border-radius:50%; border:1px solid var(--line); background:var(--glass); font-size:1.3rem; margin-bottom:.35rem}
  #rail .nv:hover:not(:disabled){background:var(--glass2)} #rail .nv:disabled{opacity:.3; cursor:default}
  #rail .wrap{position:relative; flex:1; height:100%}
  #rail .linea{position:absolute; left:0; right:0; bottom:2.15rem; height:.28rem; border-radius:9px; background:rgba(255,255,255,.16)}
  #rail .linea i{position:absolute; left:0; top:0; bottom:0; width:var(--p,0%); border-radius:9px; transition:width .8s cubic-bezier(.5,0,.2,1);
    background:linear-gradient(90deg,#4C8DFF,#E5484D,#1FBF5B,#F0A800)}
  #rail .sts{position:absolute; inset:0; display:flex; justify-content:space-between; align-items:flex-end}
  #rail .st{display:flex; flex-direction:column; align-items:center; gap:.25rem; width:6.4rem}
  #rail .st span{width:1.9rem; height:1.9rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:900;
    background:#0B1E55; border:.16rem solid var(--c,#7C8DB5); color:#fff; transition:.3s}
  #rail .st:hover span{transform:scale(1.15)}
  #rail .st em{font-style:normal; font-size:.68rem; font-weight:700; color:var(--mut); letter-spacing:.03em; text-align:center; line-height:1.1; height:1.5rem; transition:.3s}
  #rail .st.act span{background:var(--c,#fff); transform:scale(1.28); box-shadow:0 0 1.3rem var(--c,#fff)}
  #rail .st.act em{color:#fff}
  #rail .st.pas span{background:color-mix(in srgb,var(--c,#7C8DB5) 55%,#0B1E55)}
  #rail .bus{position:absolute; bottom:3.4rem; width:4.6rem; height:2.4rem; margin-left:-2.3rem; color:var(--verde); transition:left .85s cubic-bezier(.5,0,.2,1); pointer-events:none;
    animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-.18rem)}}
  #stage.sin-rail #rail{display:none}
  #stage.sin-rail #escena{bottom:.4rem}

  .maplibregl-ctrl-attrib{font-size:.7rem}
</style>
</head>
<body>

<!-- sprite de íconos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bus" viewBox="0 0 120 64">
    <rect x="3" y="6" width="114" height="42" rx="10" fill="currentColor"/>
    <rect x="3" y="34" width="114" height="7" fill="#F0A800"/>
    <g fill="#D8ECFF"><rect x="12" y="14" width="20" height="16" rx="3"/><rect x="36" y="14" width="20" height="16" rx="3"/><rect x="60" y="14" width="20" height="16" rx="3"/><rect x="84" y="14" width="26" height="16" rx="3"/></g>
    <g fill="#0B1220"><circle cx="30" cy="50" r="10"/><circle cx="92" cy="50" r="10"/></g>
    <g fill="#9DB0DC"><circle cx="30" cy="50" r="4"/><circle cx="92" cy="50" r="4"/></g>
  </symbol>
  <symbol id="i-art" viewBox="0 0 270 64">
    <rect x="2" y="8" width="122" height="40" rx="15" fill="currentColor"/>
    <rect x="146" y="8" width="122" height="40" rx="15" fill="currentColor"/>
    <path d="M124 14 q11 6 22 0 v28 q-11 -6 -22 0z" fill="#0B1220" opacity=".6"/>
    <g fill="#0B1220" opacity=".78"><rect x="14" y="16" width="26" height="15" rx="4"/><rect x="46" y="16" width="26" height="15" rx="4"/><rect x="78" y="16" width="26" height="15" rx="4"/>
      <rect x="160" y="16" width="26" height="15" rx="4"/><rect x="192" y="16" width="26" height="15" rx="4"/><rect x="224" y="16" width="28" height="15" rx="4"/></g>

  <symbol id="i-env" viewBox="0 0 48 34"><rect x="2" y="2" width="44" height="30" rx="4" fill="#fff"/><path d="M3 5 L24 20 L45 5" fill="none" stroke="#0A1F5C" stroke-width="3" stroke-linejoin="round"/></symbol>

</svg>

<div id="stage" class="sin-rail">
  <header>
    <img class="ico" src="img/logo-icon.png" alt="TransMusical">
    <div class="brand"><small>Sistema Estratégico de Transporte Público · Ibagué</small><b>Seguimiento general de alertas · UMUS</b></div>
    <span class="corte">Corte de información: <b id="corteTxt"></b></span>
    <button class="fs" id="fs" title="Pantalla completa (F)">⛶</button>
    <img class="pill" src="img/alcaldia.png" alt="Alcaldía de Ibagué">
  </header>

  <div id="escena"></div>

  <nav id="rail">
    <button class="nv" id="prev" aria-label="Anterior">‹</button>
    <div class="wrap"><div class="linea"><i id="prog"></i></div><div class="sts" id="sts"></div>
      <svg class="bus" id="railBus"><use href="#i-bus"/></svg></div>
    <button class="nv" id="next" aria-label="Siguiente">›</button>
  </nav>
  <div id="banda"><i></i><i></i><i></i><i></i></div>
  <div class="tip" id="tip"></div>
</div>

<script src="datos.js"></script>
<script src="geo.js"></script>
<script>
/* =====================================================================
   NÚCLEO: utilidades + motor de escenas
   ===================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const fm  = n => Math.round(n).toLocaleString('es-CO');
const fM  = n => '$' + Math.round(n/1e6).toLocaleString('es-CO') + ' M';                        // millones
const fB  = (n,d=1) => '$' + (n/1e9).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' mil M';
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fFecha = d => d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear();
const VIS = {};                       // clave → función(root, escena) (visuales*.js)
const limpiar = [];                   // callbacks de limpieza de la escena actual
const salvo = (f) => { try{ f() }catch(e){ console.error(e) } };

/* cuenta animada: <b data-count="75.01" data-dec="2" data-suf="%"> */
function contar(root){
  $$('[data-count]',root).forEach(n=>{
    const to=+n.dataset.count, dec=+(n.dataset.dec||0), pre=n.dataset.pre||'', suf=n.dataset.suf||'', dur=+(n.dataset.dur||1300);
    const t0=performance.now();
    (function f(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      n.textContent=pre+(to*e).toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
      if(p<1) requestAnimationFrame(f); })(t0);
  });
}

/* arrastre con pointer events (mouse + dedo) */
function arrastrar(nodo,{inicio,mueve,fin}){
  nodo.style.touchAction='none';
  nodo.addEventListener('pointerdown',e=>{
    e.preventDefault(); nodo.setPointerCapture(e.pointerId); inicio&&inicio(e);
    const mv=ev=>mueve&&mueve(ev), up=ev=>{ nodo.removeEventListener('pointermove',mv); nodo.removeEventListener('pointerup',up); nodo.removeEventListener('pointercancel',up); fin&&fin(ev); };
    nodo.addEventListener('pointermove',mv); nodo.addEventListener('pointerup',up); nodo.addEventListener('pointercancel',up);
  });
}

/* tooltip global */
const tip=$('#tip');
function verTip(html,e){ tip.innerHTML=html; tip.classList.add('ver'); const r=$('#stage').getBoundingClientRect(), k=r.width/1920*16;
  tip.style.left=Math.min(e.clientX-r.left+14, r.width-tip.offsetWidth-8)+'px'; tip.style.top=(e.clientY-r.top-tip.offsetHeight-14 <0? e.clientY-r.top+18 : e.clientY-r.top-tip.offsetHeight-14)+'px'; }
function ocultaTip(){ tip.classList.remove('ver'); }
limpiar.push(ocultaTip);

/* ---------- escenas ---------- */
const ESC = [{tipo:'portada'},{tipo:'panorama'}];
ALERTAS.forEach(a=>a.vistas.forEach((v,i)=>ESC.push({tipo:'alerta',a,v,i,de:a.vistas.length})));
ESC.push({tipo:'ruta'},{tipo:'fin'});
const idxAlerta = n => ESC.findIndex(s=>s.tipo==='alerta' && s.a.n===n);
const idxTipo   = t => ESC.findIndex(s=>s.tipo===t);

const RAIL = [{lbl:'Panorama', i:idxTipo('panorama'), c:'#fff', t:'⌂'},
  ...ALERTAS.map(a=>({lbl:a.corto, i:idxAlerta(a.n), c:CAT[a.cat].c, t:a.n})),
  {lbl:'Ruta 2026', i:idxTipo('ruta'), c:'#F0A800', t:'➜'}];

let idx = -1;
function nodoAlerta(s){
  const a=s.a, v=s.v, col=CAT[a.cat].c;
  const n=document.createElement('section'); n.className='scene'; n.style.setProperty('--cat',col);
  n.innerHTML=`
    <aside class="izq">
      <div class="tags rv"><span class="tag num">Alerta ${a.n}</span><span class="tag">${a.per}</span><span class="tag">${a.comp}</span>
        <span class="tag cat"><i></i>${CAT[a.cat].n}</span>${s.de>1?`<span class="tag">Vista ${s.i+1}/${s.de}</span>`:''}</div>
      <h1 class="rv">${a.t}</h1>
      <p class="msg rv">${a.msg}</p>
      <h3 class="rv">Situación</h3>
      <ul class="sit">${v.sit.map(t=>`<li class="rv">${t}</li>`).join('')}</ul>
      <div class="postura rv"><b>Postura del SETP</b><p>${a.postura}</p></div>
    </aside>
    <main class="vis card"></main>`;
  return n;
}
function ir(n){
  n=Math.max(0,Math.min(ESC.length-1,n)); if(n===idx) return;
  const atras=n<idx; limpiar.splice(0).forEach(salvo); idx=n; const s=ESC[n];
  let nodo;
  if(s.tipo==='alerta') nodo=nodoAlerta(s); else { nodo=document.createElement('section'); nodo.className='scene'; nodo.style.display='block'; }
  if(atras) nodo.classList.add('atras');
  const cont=$('#escena'); cont.innerHTML=''; cont.append(nodo);
  $$('.rv',nodo).forEach((e,i)=>e.style.setProperty('--i',i));
  const fn = s.tipo==='alerta' ? VIS[s.v.vis] : VIS[s.tipo];
  if(fn) salvo(()=>fn(s.tipo==='alerta'?$('.vis',nodo):nodo, s));
  contar(nodo);
  $('#stage').classList.toggle('sin-rail', s.tipo==='portada'||s.tipo==='fin');
  actualizaRail();
  history.replaceState(null,'','#'+n);
}
function actualizaRail(){
  const s=ESC[idx]; let act=-1;
  RAIL.forEach((r,k)=>{ const el=$('#st'+k); if(!el) return;
    const es = s.tipo==='alerta'? r.t===s.a.n : (s.tipo==='panorama'&&k===0) || (s.tipo==='ruta'&&k===RAIL.length-1);
    if(es) act=k; el.classList.toggle('act',es); });
  RAIL.forEach((r,k)=>{ const el=$('#st'+k); if(el) el.classList.toggle('pas', act>=0 && k<act); });
  if(act<0) return;
  $('#prog').parentNode.style.setProperty('--p', (act/(RAIL.length-1)*100)+'%'); $('#prog').style.setProperty('--p',(act/(RAIL.length-1)*100)+'%');
  posBus(act);
  $('#prev').disabled = idx<=0; $('#next').disabled = idx>=ESC.length-1;
}
function posBus(act){
  const st=$('#st'+act), wrap=$('#rail .wrap'); if(!st) return;
  const a=st.getBoundingClientRect(), w=wrap.getBoundingClientRect(), k=$('#stage').getBoundingClientRect().width/120/16; // px por rem-lienzo
  $('#railBus').style.left=((a.left+a.width/2-w.left)/ (parseFloat(getComputedStyle(document.documentElement).fontSize)))+'rem';
}
$('#sts').innerHTML = RAIL.map((r,k)=>`<button class="st" id="st${k}" style="--c:${r.c}" title="${r.lbl}"><span>${r.t}</span><em>${r.lbl}</em></button>`).join('');
RAIL.forEach((r,k)=>$('#st'+k).onclick=()=>ir(r.i));
$('#prev').onclick=()=>ir(idx-1); $('#next').onclick=()=>ir(idx+1);
$('#corteTxt').textContent=CORTE.txt;
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
window.addEventListener('resize',()=>{ const s=ESC[idx]; if(!s) return; actualizaRail(); });
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !['ArrowLeft','ArrowRight'].includes(e.key)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown') ir(idx+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp') ir(idx-1);
  else if(e.key==='Home') ir(0); else if(e.key==='End') ir(ESC.length-1);
  else if(/^[1-9]$/.test(e.key)) ir(idxAlerta(+e.key));
  else if(e.key==='p'||e.key==='P') ir(idxTipo('panorama'));
  else if(e.key==='r'||e.key==='R') ir(idxTipo('ruta'));
  else if(e.key==='f'||e.key==='F') $('#fs').click();
});
</script>
